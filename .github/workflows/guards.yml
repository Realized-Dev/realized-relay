# Trusted default-branch workflow.
# pull_request_target always loads this file from the base branch.
# Edits in a pull request do not run until they are merged to main.
# See docs/guard-workflow.md.
name: guards

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  # ci.yml still runs on pull_request_review (no secrets). This event
  # re-runs the approver from the trusted base-branch copy of this file.
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guards-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  denylist:
    name: denylist
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base-branch scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Materialize pull request files as data
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELAY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          set +x
          dest="${RUNNER_TEMP}/pr-head"
          mkdir -p "$dest"
          ./checks/materialize-pr-head.sh "$RELAY_HEAD_SHA" "$dest"
          printf 'RELAY_SCAN_ROOT=%s\n' "$dest" >> "$GITHUB_ENV"
      - name: Scan materialized files with the trusted script
        env:
          RELAY_DENYLIST: ${{ secrets.RELAY_DENYLIST }}
          RELAY_SCAN_ROOT: ${{ env.RELAY_SCAN_ROOT }}
          RELAY_CHECK_MODE: ci
        run: |
          set -eu
          set +x
          ./checks/denylist.sh

  label-guard:
    name: label-guard
    if: >
      github.event_name == 'pull_request_target'
      || github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base-branch scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - name: Read labels (fail closed)
        env:
          RELAY_CHECK_MODE: ci
          RELAY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          set +x
          ./checks/label-guard.sh

  approver:
    name: approver
    if: >
      github.event_name == 'pull_request_target'
      || github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base-branch scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - name: Require approval on the current head SHA when gated
        env:
          RELAY_CHECK_MODE: ci
          RELAY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          set +x
          ./checks/approver-check.sh
