name: protected-paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted base-branch scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Run protected-paths check from base
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELAY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELAY_PP_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELAY_PP_SENDER: ${{ github.event.sender.login }}
          RELAY_PP_BODY: ${{ github.event.pull_request.body }}
          RELAY_CHECK_MODE: ci
        run: |
          set -eu
          set +x
          ./checks/protected-paths.sh
